# ── Vireon CLI subscriber config ──────────────────────────────────────
#
# Copy this file to /etc/vireon/subscribers/<name>.conf, edit the values,
# then start the instance:
#
#   sudo cp /etc/vireon/subscribers/example.conf /etc/vireon/subscribers/logging.conf
#   sudo nano /etc/vireon/subscribers/logging.conf
#   sudo systemctl enable --now vireon-sub@logging
#
# Output goes to journald:
#   journalctl -u vireon-sub@logging -f

# Topic pattern to subscribe to (`*` = single-segment wildcard).
PATTERN=sensor.*

# Output format: text | json
FORMAT=json
