# ═══════════════════════════════════════════════════════════════════
#  Vireon QUIC Server — System Default Config
#
#  Installed to /etc/vireon/vireon.conf by scripts/install.sh
#  CLI flags override values here. Run `quic-server --help` for all flags.
#
#  NOTE: All top-level keys MUST come before any [section] header.
#  In TOML, keys after [section] belong to that section.
# ═══════════════════════════════════════════════════════════════════

# ── Network ──────────────────────────────────────────────────────────
port = 4433
bind = "0.0.0.0"

cert = "/etc/vireon/certs/cert.pem"
key  = "/etc/vireon/certs/key.pem"

# mTLS CA bundle (empty = no client cert verification).
client_ca = ""

# ── Workers ──────────────────────────────────────────────────────────
# "multi" = thread-per-core (production). "single" = 1 thread (dev).
mode = "multi"
# 0 = auto (one worker per CPU core).
workers = 0

# ── Tuning ───────────────────────────────────────────────────────────
preset = "bare-metal"   # cloud | bare-metal | hundred-gbe | low-latency | max-throughput
skip_crc = true         # QUIC AEAD already guarantees integrity; saves ~5-8% CPU
log_format = "json"     # JSON for journald / log aggregators

# ── WAL (durable publish + crash recovery) ───────────────────────────
wal_root = "/var/lib/vireon/wal"
wal_retention_secs = 86400   # 1 day
wal_max_bytes = 0            # 0 = no size cap
wal_sweep_interval_secs = 60

# ── Observability ────────────────────────────────────────────────────
# Prometheus /metrics endpoint. 0 = disabled.
metrics_port = 9090

# ── Security ─────────────────────────────────────────────────────────
# Max new TLS handshakes/sec per source IP. 0 = unlimited.
max_handshakes_per_ip_per_sec = 0

# TOML ACL rules file (empty = permissive default).
acl_rules_path = ""

# ── Cluster (single-node: leave as-is) ───────────────────────────────
cluster_node_id = 0
cluster_peers = ""
cluster_replication_factor = 1

# ═══════════════════════════════════════════════════════════════════
#  Sections below — all top-level keys must be above this line
# ═══════════════════════════════════════════════════════════════════

# ── WAL fsync policy ─────────────────────────────────────────────────
[wal_sync]
mode = "group_commit"        # never | batched | group_commit
group_commit_ms = 100

# ── QUIC Engine (overrides preset defaults — tune only what you need) ─
[quic]
max_connections = 65536          # per shard (× num_cores)
max_streams_bidi = 1024
max_streams_uni = 1024
initial_max_data = "100MiB"
initial_max_stream_data = "10MiB"
idle_timeout = "30s"
handshake_timeout = "30s"
congestion = "cubic"             # reno | cubic | bbr | bbr2
